<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị hệ thống - DLMStore</title>
    <!-- Sử dụng font Plus Jakarta Sans cho giao diện hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ĐỒNG BỘ MÀU ĐỎ TỪ CLIENT */
            --primary: #cb1c22; 
            --primary-dark: #a6171c; 
            --bg-body: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --error-bg: #fef2f2;
            --error-text: #ef4444;
            --error-border: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* Container chính với Layout chia đôi */
        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            margin: 20px;
        }

        /* Cột bên trái - Branding (Đổi màu sang Đỏ Gradient) */
        .branding-side {
            flex: 1;
            background: linear-gradient(135deg, var(--primary) 0%, #d9503f 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        /* Họa tiết mờ ảo trang trí background */
        .branding-side::after {
            content: '';
            position: absolute;
            bottom: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }
        .branding-side::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
            z-index: 1;
        }

        .brand-logo span {
            color: #fca5a5; /* Chữ Store màu đỏ nhạt */
        }

        .brand-welcome {
            z-index: 1;
        }

        .brand-welcome h2 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .brand-welcome p {
            font-size: 16px;
            color: #fee2e2;
            line-height: 1.6;
            max-width: 80%;
        }

        /* Cột bên phải - Form */
        .form-side {
            width: 450px;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 35px;
        }

        .form-header h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
            color: var(--text-main);
            background-color: #fafafa;
        }

        /* Hiệu ứng viền đỏ khi focus */
        .input-wrapper input:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(203, 28, 34, 0.1); 
        }

        .input-wrapper svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #94a3b8;
            transition: color 0.2s ease;
        }

        .input-wrapper input:focus + svg {
            color: var(--primary);
        }

        .btn-login {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Bóng đổ màu đỏ khi hover */
        .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -6px rgba(203, 28, 34, 0.4); 
        }

        .btn-login:disabled {
            background-color: #94a3b8;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }

        .error-message {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .system-footer {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        @media (max-width: 800px) {
            .login-wrapper {
                flex-direction: column;
                max-width: 450px;
            }
            .branding-side {
                padding: 40px 30px;
                text-align: center;
            }
            .brand-welcome p {
                max-width: 100%;
            }
            .form-side {
                width: 100%;
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Cột Trái: Đã chuyển sang gradient đỏ -->
        <div class="branding-side">
            <div class="brand-logo">DLM<span>Store</span></div>
            <div class="brand-welcome">
                <h2>Hệ thống<br>Quản trị Cấp cao</h2>
                <p>Nền tảng vận hành và quản lý dữ liệu tập trung dành cho đội ngũ DinhLuongMobile.</p>
            </div>
        </div>

        <div class="form-side">
            <div class="form-header">
                <h3>Đăng nhập Workspace</h3>
                <p>Vui lòng nhập thông tin xác thực để tiếp tục</p>
            </div>

            <div id="errorMessage" class="error-message">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="errorText"></span>
            </div>

            <form id="adminLoginForm">
                <div class="input-group">
                    <label for="email">Tài khoản Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="admin@dlmstore.com" required autocomplete="email">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-login">
                    Truy cập hệ thống
                </button>
            </form>

            <div class="system-footer">
                &copy; 2026 DinhLuongMobile. Internal Use Only.
            </div>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            errorDiv.style.display = 'none';
            errorText.innerText = '';
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
                Đang xác thực...
            `;
            
            if(!document.getElementById('spinStyle')) {
                const style = document.createElement('style');
                style.id = 'spinStyle';
                style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
                document.head.appendChild(style);
            }

            try {
                const response = await fetch('/api/auth/admin-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await response.json();

                if (response.ok && data.data && data.data.token) {
                    const token = data.data.token;
                    window.location.href = `https://localhost:5173/admin?token=${token}`; 
                } else {
                    errorText.innerText = data.message || 'Đăng nhập thất bại. Vui lòng kiểm tra lại.';
                    errorDiv.style.display = 'flex';
                }
            } catch (error) {
                console.error('Lỗi kết nối:', error);
                errorText.innerText = 'Lỗi kết nối máy chủ. Vui lòng thử lại sau.';
                errorDiv.style.display = 'flex';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Truy cập hệ thống';
            }
        });
    </script>
</body>
</html>
